<div class="payment-container">
    <h4 style="text-align: center;">Enter Your Payment Details</h4>
    <form [formGroup]="paymentForm" (ngSubmit)="submitForm()">
    <div class="row">
        <div class="col-md-6">
            <label>Card Number</label>
            <input type="text" formControlName="cardNumber" placeholder="1234 5678 9012 3456">
        </div>
        <div class="col-md-6">
            <label>Expiry Date (MM/YY)</label>
            <input type="text" formControlName="expiry" placeholder="MM/YY">
        </div>
    </div>      
    <div class="row">
        <div class="col-md-6">
            <label>CVV</label>
            <input type="text" formControlName="cvv" placeholder="123">
        </div>
        <div class="col-md-6">
            <label>First Name</label>
            <input type="text" formControlName="firstName">
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <label>Last Name</label>
            <input type="text" formControlName="lastName">
        </div>
        <div class="col-md-6">
            <label>Billing Address</label>
            <input type="text" formControlName="billingAddress">
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">     
            <label>City</label>
            <input type="text" formControlName="city">
        </div>
        <div class="col-md-6">
            <label>State</label>
            <input type="text" formControlName="state">
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <label>PIN Code</label>
            <input type="text" formControlName="pinCode">
        </div>
        <div class="col-md-6">
            <label>Country</label>
            <input type="text" formControlName="country">
        </div>
    </div>
    <div class="row">
        <div class="col-md-5">
            <label>Phone Number</label>
            <input type="text" formControlName="phone">
        </div>
        <div class="col-md-2">
            <label>&nbsp; </label>
            <button style="margin: auto;
            justify-content: center;
            align-items: center;
            vertical-align: text-bottom;
            display: flex
        ;" class="bg-success">Send OTP</button>
        </div>
        <div class="col-md-5">
            <label>OTP</label>
            <input type="text" formControlName="gst">
        </div>
    </div>
    <button type="submit" [disabled]="paymentForm.invalid">Submit</button>
    </form>
  </div>
